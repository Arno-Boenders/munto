name: Something doesn't work
description: A bug, a crash, or something that does the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't share real financial data here**: no real amounts, balances, IBANs, merchant or payee names from your own statements, or screenshots of your own data. This page is public. If it helps, show the problem with the sample data (*Try with sample data*), or make an example up (€12.34, "Bakery", BE00 0000 0000 0000).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open Budget
        2. Click …
        3. …
  - type: input
    id: version
    attributes:
      label: Munto version
      description: Settings → Updates shows it.
      placeholder: 0.3.1
  - type: dropdown
    id: how
    attributes:
      label: How do you run Munto?
      options:
        - The downloaded desktop app
        - The desktop app built from source (npm run app:install)
        - In the browser (npm run ui)
        - The command line
  - type: input
    id: system
    attributes:
      label: Computer
      placeholder: macOS 15 on Apple Silicon, Windows 11, Ubuntu 24.04…
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Copy the message Munto showed, or the terminal output. Check it for anything private first.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: There's no real financial data in this issue.
          required: true
