# Builds the downloads (npm run dist) on macOS, Windows and Linux. On a version tag (v0.2.0, matching
# "version" in package.json) each build uploads straight into a draft release to check and publish by hand.
# Started by hand (Actions → Release → Run workflow) with a tag filled in, it builds that tag and fills
# its draft release the same way, e.g. to redo a release whose builds failed. Started by hand without a
# tag, the builds are only kept as artifacts on the run, to try them out. A PR that changes the packaging
# only checks that the builds succeed: its downloads aren't kept, so PRs don't fill the artifact quota.
# Unsigned: see README, Desktop app → Download.
#
# Releases skip artifacts on purpose: the private repo's artifact storage quota (~1.6 GB per run) fills
# up in a few runs and then stays full for hours, which blocked every release build.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build and attach to its draft release (leave empty to just build)
        required: false
  pull_request:
    paths: [scripts/dist.mjs, .github/workflows/release.yml, package.json, package-lock.json, electron/**]

permissions:
  contents: read

# The token is only handed to the steps that call gh, never to npm ci / npm run dist (install scripts).
env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  draft:
    if: github.ref_type == 'tag' || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft release (once)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --generate-notes --verify-tag --title "$TAG"

  build:
    needs: draft
    if: ${{ !failure() && !cancelled() }} # also when there's no draft to make
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write # uploading to the draft release; only used by that step
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }} # empty: the commit that started the run
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # electron-builder fetches the Electron for each target itself
      - run: npm test
      - run: npm run dist
        env:
          DB_PATH: ${{ runner.temp }}/budget.db
          CONFIG_PATH: ${{ runner.temp }}/categories.json
      - name: Upload to the draft release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage dist/*.deb)
          [ ${#files[@]} -gt 0 ] || { echo "No downloads in dist/"; exit 1; }
          gh release upload "$TAG" "${files[@]}" -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: env.TAG == '' && github.event_name == 'workflow_dispatch'
        with:
          name: munto-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 7
