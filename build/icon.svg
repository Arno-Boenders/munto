<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Munto app icon: the coin (the same as the menu's and the browser tab's) on the app's plum. macOS grid:
       an 824 px rounded square centred on a 1024 canvas, transparent around it. Render with `npm run icon`. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2146"/>
      <stop offset="1" stop-color="#22122a"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ground)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <!-- the coin: 32-unit drawing scaled to 560 px, centred -->
  <g filter="url(#drop)" transform="translate(232 232) scale(17.5)">
    <circle cx="16" cy="16" r="14.2" fill="#a9505f" stroke="#7a3442" stroke-width="1.6"/>
    <circle cx="16" cy="16" r="10.2" fill="none" stroke="#7a3442" stroke-opacity="0.55" stroke-width="1"/>
    <path d="M19.6 11.8a5.2 5.2 0 1 0 0 8.4M10.8 14.6h6.4M10.8 17.4h6.4" fill="none" stroke="#fde8eb" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
